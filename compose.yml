name: cothrom-site

networks:
  frontend:
  backend:

# volumes:

services:
  # cloudflare-tunnel: final serving via cloudflare tunnel
  nginx:
    image: nginx:latest
    ports:
      - 8039:80
    volumes:
      - ./site:/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend

