# Deploy Hugo → Cloudflare Pages (Direct Upload via Wrangler).
# Production host: https://cothrom.ie/ (www → apex via Cloudflare Bulk Redirect).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#          N8N_CONTACT_WEBHOOK_URL, TURNSTILE_SITE_KEY

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Build
        env:
          HUGO_PARAMS_CONTACT_WEBHOOKURL: ${{ secrets.N8N_CONTACT_WEBHOOK_URL }}
          HUGO_PARAMS_CONTACT_TURNSTILESITEKEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          hugo --gc --minify
          test -f site/index.html
          test -f site/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=cothrom-site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
