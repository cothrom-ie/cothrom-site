# Deploy Hugo → Cloudflare Pages (Direct Upload via Wrangler).
# Production host: https://cothrom.ie/ (www → apex via Cloudflare Bulk Redirect).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#          N8N_CONTACT_WEBHOOK_URL, TURNSTILE_SITE_KEY

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Build
        env:
          HUGO_PARAMS_CONTACT_WEBHOOKURL: ${{ secrets.N8N_CONTACT_WEBHOOK_URL }}
          HUGO_PARAMS_CONTACT_TURNSTILESITEKEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          hugo --gc --minify
          test -f site/index.html
          test -f site/_headers

      # Fail fast with a clear message if GH secrets are missing/empty.
      # Wrangler often only prints "exit code 1" when the token/account is wrong.
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing or empty."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing or empty."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add both under Settings → Secrets and variables → Actions."
            echo "Token needs Account → Cloudflare Pages → Edit."
            echo "Account ID is the 32-char hex from the dashboard sidebar (not your user ID)."
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty: Hugo writes into ./site on a clean checkout (uncommitted).
          # Creates the Direct Upload project on first success if it does not exist.
          command: pages deploy site --project-name=cothrom-site --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
