# Phase 5: a few base images ship a mime.types without application/manifest+json
# mapped to .webmanifest — add it explicitly so static/site.webmanifest always
# serves with the right Content-Type regardless of base image vintage.
types {
    application/manifest+json webmanifest;
}

server {
    listen 80;
    server_name _;
    root /site;
    index index.html;

    # Phase 5 (AppSec hardening, security-devsecops-ssdls-appsec rule): baseline
    # security headers. CSP allows 'unsafe-inline' for script/style because both
    # the No Fate theme (dark/light FOUC-prevention script) and this site's own
    # Gallery/Contact page scripts are inline, not nonce/hash-based — tightening
    # that further would need template changes beyond Phase 5 scope. The one
    # permitted third-party origin is Cloudflare Turnstile (C5 S2, Contact form
    # spam control), loaded only when TURNSTILE_SITE_KEY is set at build time.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; form-action 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Hugo pretty URLs: /contact/ → /contact/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Cache fingerprinted / static assets lightly
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
