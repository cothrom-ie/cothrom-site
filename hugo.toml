# Cothrom Productions — Hugo site config
# Theme: No Fate v0.1.0 (themes/no-fate). Deploy output matches compose.yml → ./site

baseURL = "https://cothrom.ie/"
languageCode = "en-GB"
defaultContentLanguage = "en"
title = "Cothrom Productions"
theme = "no-fate"
publishDir = "site"
enableRobotsTXT = true

[pagination]
  pagerSize = 12

# Phase 5: no content on this site uses tags/categories front matter, so
# disable Hugo's default taxonomies entirely rather than publishing empty
# /categories/ and /tags/ list pages (previously showing up in sitemap.xml
# with nothing on them).
[taxonomies]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "production-management"
    name = "Production Management"
    url = "/production-management/"
    weight = 10
  [[menu.main]]
    identifier = "technical-direction"
    name = "Technical Direction"
    url = "/technical-direction/"
    weight = 20
  [[menu.main]]
    identifier = "creative-technology"
    name = "Creative Technology"
    url = "/creative-technology/"
    weight = 30
  [[menu.main]]
    identifier = "system-design"
    name = "System Design"
    url = "/system-design/"
    weight = 40
  [[menu.main]]
    identifier = "gallery"
    name = "Gallery"
    url = "/gallery/"
    weight = 50
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 60

[params]
  author = "Dominic Capparelli"
  description = "Production management, technical direction, creative technology, and system design for live events."
  # Phase 5: sitewide fallback OG/Twitter image for pages with no visual.hero
  # of their own (Contact, thanks, Gallery) — the theme's get-page-images.html
  # falls back to this only when a page has no hero/seo.image/images/cover.
  images = ["/images/social/og-default.jpg"]
  # nav-chrome-light-logo: site is light-only — no dark/auto flip, no toggle.
  defaultTheme = "light"
  disableThemeToggle = true
  hideAuthor = true
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = false
  ShowShareButtons = false
  [params.label]
    text = "Cothrom"
    # nav-chrome-light-logo: kraft triskelion mark rendered left of the label
    # in the site header override (layouts/_partials/header.html).
    logo = "/images/logos/cothrom-mark-kraft.svg"
  [params.footer]
    hideCopyright = false
    hidePoweredBy = true
    text = "Cothrom Productions"

  # C5 L1: LinkedIn is the only public contact channel — footer (all pages) + Contact page
  [params.social]
    linkedin = "https://www.linkedin.com/in/dominic-capparelli/"

  # Phase 5: feeds the Organization schema.org "sameAs" property on Home
  # (themes/no-fate/layouts/_partials/templates/schema_json.html) — otherwise
  # it renders an empty array even though LinkedIn is configured above.
  [params.schema]
    sameAs = ["https://www.linkedin.com/in/dominic-capparelli/"]

  # C5 T1/S2: contact form endpoint + Turnstile site key. Left blank here on
  # purpose — real values are supplied at `hugo build` time via env vars
  # (N8N_CONTACT_WEBHOOK_URL / TURNSTILE_SITE_KEY), mapped by the Makefile to
  # Hugo's HUGO_PARAMS_* config overlay. Never commit real values here.
  #
  # NOTE: param keys below deliberately avoid underscores — Hugo's env var
  # overlay treats every underscore as a new nesting level (HUGO_PARAMS_A_B
  # sets params.a.b, not params.a_b), so "webhook_url" would not bind as a
  # single key. Keep these as one unbroken word if you rename them.
  [params.contact]
    webhookurl = ""
    turnstilesitekey = ""

  # No Fate theme contract (C1: clean + kraft overrides in assets/css/extended/)
  [params.noFate]
    style = "clean"
    defaultMode = "editorial"
    defaultAccent = "signal"
    showThemeToggle = false
    showSearch = false
    showReadingTime = false
    showPropositions = false
    enableImageProcessing = true
    validateContentModel = true
    strictHomeSelections = false

    [params.noFate.home]
      modules = ["opening"]
      featuredProposition = ""

    [params.noFate.images]
      widths = [480, 800, 1200, 1600]
      webpQuality = 82

  # Phase 5: favicons / site icons, generated from the locked kraft mark
  # (assets-general/logos/cothrom-mark-kraft*.png — see docs/image-register.md
  # "chrome" rows). Files live under static/ (static/favicon.ico,
  # static/images/icons/*, static/site.webmanifest).
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/images/icons/favicon-16x16.png"
    favicon32x32 = "/images/icons/favicon-32x32.png"
    apple_touch_icon = "/images/icons/apple-touch-icon.png"
    theme_color = "#be9e6c"
    msapplication_TileColor = "#be9e6c"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    noClasses = false
