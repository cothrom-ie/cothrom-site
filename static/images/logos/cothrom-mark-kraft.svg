<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title description">
  <title id="title">Cothrom triskelion</title>
  <desc id="description">A near-black brown PCB-style triskelion on a kraft-coloured background.</desc>

  <metadata>
    Background: #BE9E6C
    Mark: #1D120D
  </metadata>

  <defs>
    <path id="pcb-triskelion-arm"
          d="M 0,0
             H 3.15
             L 5.55,-2.40
             V -4.55
             L 3.95,-6.15
             H 1.75
             L 0.35,-4.75"/>
  </defs>

  <rect width="512" height="512" fill="#BE9E6C"/>

  <g transform="translate(256 256) rotate(-90) scale(31)"
     fill="none"
     stroke="#1D120D"
     stroke-width="0.72"
     stroke-linecap="butt"
     stroke-linejoin="miter"
     shape-rendering="geometricPrecision">
    <use href="#pcb-triskelion-arm"/>
    <use href="#pcb-triskelion-arm" transform="rotate(120)"/>
    <use href="#pcb-triskelion-arm" transform="rotate(240)"/>
  </g>
</svg>
